
version: 2

models:
  - name: agg_weather_daily
    description: "Daily weather metrics aggregated by location and date"

    columns:
      - name: location_key
        data_tests:
          - not_null:
              config:
                where: "source_max_ingested_at = (SELECT MAX(source_max_ingested_at) FROM weather_gold_lakehouse.aggregates.agg_weather_daily)"
          - relationships:
              arguments:
                to: ref('dim_location')
                field: location_key

      - name: date_key
        data_tests:
          - not_null:
              config:
                where: "source_max_ingested_at = (SELECT MAX(source_max_ingested_at) FROM weather_gold_lakehouse.aggregates.agg_weather_daily)"
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: total_hourly_records
        data_tests:
          - not_null:
              config:
                where: "source_max_ingested_at = (SELECT MAX(source_max_ingested_at) FROM weather_gold_lakehouse.aggregates.agg_weather_daily)"

      - name: avg_temperature
        data_tests:
          - not_null:
              config:
                where: "source_max_ingested_at = (SELECT MAX(source_max_ingested_at) FROM weather_gold_lakehouse.aggregates.agg_weather_daily)"
